<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Arbre de Compétences — Warhammer RPG</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tree-container {
      width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    .tree-branch {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      position: relative;
    }
    .tree-node {
      background: #161622;
      border: 2px solid #d4af37;
      border-radius: 8px;
      padding: 15px;
      width: 150px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .tree-node.unlocked {
      background: #0f2d1e;
      border-color: #2ed573;
      box-shadow: 0 0 15px rgba(46, 213, 115, 0.4);
    }
    .tree-node.locked {
      opacity: 0.5;
      border-color: #555;
      cursor: not-allowed;
    }
    .tree-node:hover:not(.locked):not(.unlocked) {
      background: #8b0000;
      transform: translateY(-5px);
    }
  </style>
</head>
<body>

  <div class="card tree-container">
    <h1>🌟 Arbre de Compétences</h1>
    
    <div class="stat-box" style="margin-bottom: 20px;">
      <div><strong>Points de Compétences Disponibles :</strong> <span id="tree-pts" style="color: #ff4757; font-size: 1.2em; font-weight: bold;">0</span></div>
    </div>

    <!-- Branche de compétences générée dynamiquement -->
    <div id="tree-nodes-wrapper"></div>

    <div id="log" style="margin-top: 20px;">Sélectionne un nœud pour attribuer un point.</div>

    <a href="index.html" class="nav-btn" style="display: inline-block; text-decoration: none; margin-top: 20px; width: 200px;">⬅️ Retour au Labyrinthe</a>
  </div>

  <script src="tree.js"></script>
</body>
</html>
